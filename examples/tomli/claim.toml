# The claim: a conforming TOML 1.0.0 parser.
#
# Read the class column before anything else. `tomli/` is GENERATED, so the
# parser's bytes are OUTSIDE this claim's root. Everything that decides
# pass/fail -- this recipe, check_toml.py, and all 917 corpus files -- is
# PINNED, so it is INSIDE. The root therefore names an equivalence class
# ("a program that parses TOML 1.0.0 as toml-test says it must"), not one
# program. Swap tomli for CPython's stdlib tomllib and the root is unchanged;
# edit one corpus byte and it is a different claim.
#
# The four produce steps name the four module paths rather than the directory
# because the kernel materializes and digests generated outputs as files. The
# paths are named; none of their bytes enter the root.
#
# Third-party material, carried with its licences:
#   tomli/        tomli 2.3.1 (MIT) -- the last release that targets TOML 1.0.0;
#                 2.4.0 moved to TOML 1.1.0 and fails nine of these cases.
#   cases/        toml-test (MIT), exactly the files listed in that project's
#                 tests/files-toml-1.0.0: 208 valid pairs + 501 invalid.

[claim]
name = "toml-1.0.0"
requires = ["python3"]
gate_timeout = 120.0
