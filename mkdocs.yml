# The documentation site: literate pages woven from the generated tree, plus
# the hand-written guides. docs/book/ is DERIVED (python3 docs/weave.py);
# the paper and pinned bytes are deliberately not rendered here.
site_name: reticuli
site_description: >-
  A system of record for software: identity by acceptance criteria,
  specification, and recipe; implementations reproducible, interchangeable,
  and independently verified.
repo_url: https://github.com/rz4/reticuli
docs_dir: docs
exclude_docs: |
  paper/
  assets/
  weave.py
  transcribe.py
theme:
  name: readthedocs
  highlightjs: true
nav:
  - Overview: index.md
  - A terminal session: session.md
  - The process: process.md
  - Using claims:
      - Receiving: receiving.md
      - Quickstart: quickstart.md
      - Capturing: capturing.md
      - Releasing: releasing.md
      - Threat model: threat-model.md
  - Producing with agents:
      - Working with agents: agents.md
      - Writing criteria: criteria.md
      - Producing: producers.md
      - GitHub and CI: github.md
  - Evolving the specification:
      - Zeta internals: zeta.md
      - Transitions: transitions.md
      - Design rationale: design-rationale/README.md
  - Internals:
      - Mechanisms: mechanisms.md
      - Components: components.md
  - Reference:
      - CLI: cli.md
      - Glossary: glossary.md
      - Compatibility: compatibility.md
      - CLI style: cli-style.md
  - The annotated implementation: book/index.md
markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true
