# THE RETICULI MANUAL. This site teaches how to use reticuli, and that is its
# whole job. The nav is a learning progression, not a subject taxonomy: start,
# then the three things a person actually does with a claim -- make one,
# receive one, regrow one -- then changing one, then reference.
#
# What is deliberately NOT here: the findings. What reticuli has been measured
# to do lives in findings/ in the repository, next to the research data those
# claims are about, where a reader can check them against bytes. This site is
# the manual; the repository is the evidence.
#
# docs/book/ is DERIVED (python3 docs/weave.py). The paper and the pinned
# bytes -- criteria/, spec/, zeta's criteria -- are not rendered here either;
# they are the identity, and belong read as bytes.
site_name: The reticuli manual
site_description: >-
  How to use reticuli: name software by its acceptance criteria, make claims,
  re-earn verdicts on your own machine, and regrow an implementation from the
  tests alone.
site_url: https://rz4.github.io/reticuli/
repo_url: https://github.com/rz4/reticuli
repo_name: rz4/reticuli
edit_uri: edit/main/docs/
copyright: >-
  Pre-release research software. Read
  <a href="threat-model/">what a claim proves, and what it does not</a>
  before relying on anything here.

docs_dir: docs
exclude_docs: |
  paper/
  weave.py
  transcribe.py
  requirements.txt
# The annotated implementation is one nav entry over ~70 generated pages;
# they are reachable from its index rather than listed individually.
not_in_nav: |
  book/

theme:
  name: material
  # The reticle the constellation is named after. docs/assets/logo.png is a
  # star field on a white ground: right for the README, wrong for a coloured
  # header bar and worse for a favicon.
  icon:
    logo: material/crosshairs
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/reticuli.css

nav:
  - The manual: index.md
  - Getting started:
      - Quickstart — ten minutes, no API key: quickstart.md
      - How a claim works: process.md
      - Glossary: glossary.md
  - How do I…?: how-do-i.md
  - Making a claim:
      - Make a claim: make-a-claim.md
      - Capturing work: capturing.md
      - Writing criteria that carry software: criteria.md
      - Composing claims: composition.md
  - Receiving a claim:
      - Receiving a claim: receiving.md
      - What a claim proves, and what it does not: threat-model.md
      - GitHub and CI: github.md
  - Rebuilding with agents:
      - Working with agents: agents.md
      - Writing a producer: producers.md
  - Changing a claim:
      - Transitions: transitions.md
      - Releasing: releasing.md
      - Zeta internals: zeta.md
      - Design rationale:
          - design-rationale/README.md
          - Format 3, and why guidance left the root: design-rationale/format3.md
  - Reference:
      - CLI: cli.md
      - CLI style contract: cli-style.md
      - Compatibility: compatibility.md
      - Mechanisms: mechanisms.md
      - Components: components.md
      - The annotated implementation: book/index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list          # {#custom-anchor} targets, linked from the glossary
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rz4/reticuli
      name: reticuli on GitHub
