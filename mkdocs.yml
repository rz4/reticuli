# The documentation site: the hand-written guides, plus the literate pages
# woven from the generated tree. docs/book/ is DERIVED (python3 docs/weave.py);
# the paper and the pinned bytes are deliberately not rendered here.
#
# The nav is ordered for a reader deciding whether to trust this, not for one
# who has already decided to use it: what it is, then what a verdict does and
# does not establish, then how to re-earn one without taking our word for it.
# The limits sit near the front on purpose.
site_name: reticuli
site_description: >-
  A system of record for software: identity by acceptance criteria,
  specification, and recipe; implementations reproducible, interchangeable,
  and independently verified.
site_url: https://rz4.github.io/reticuli/
repo_url: https://github.com/rz4/reticuli
repo_name: rz4/reticuli
edit_uri: edit/main/docs/
copyright: >-
  Pre-release research software. Read
  <a href="threat-model/">what a claim proves, and what it does not</a>
  before relying on anything here.

docs_dir: docs
exclude_docs: |
  paper/
  weave.py
  transcribe.py
  requirements.txt
# The annotated implementation is one nav entry over ~70 generated pages;
# they are reachable from its index rather than listed individually.
not_in_nav: |
  book/

theme:
  name: material
  # The reticle the constellation is named after. docs/assets/logo.png is a
  # star field on a white ground: right for the README, wrong for a coloured
  # header bar and worse for a favicon.
  icon:
    logo: material/crosshairs
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/reticuli.css

nav:
  - Overview: index.md
  - Start here:
      - What a claim proves, and what it does not: threat-model.md
      - Quickstart — ten minutes, no API key: quickstart.md
      - The process: process.md
      - Glossary: glossary.md
  - Using claims:
      - Receiving a claim: receiving.md
      - Make a claim: make-a-claim.md
      - Capturing work: capturing.md
      - GitHub and CI: github.md
      - Releasing: releasing.md
  - Producing with agents:
      - Working with agents: agents.md
      - Writing criteria: criteria.md
      - Writing a producer: producers.md
  - Evolving the specification:
      - Transitions: transitions.md
      - Zeta internals: zeta.md
      - Design rationale:
          - design-rationale/README.md
          - Format 3, and why guidance left the root: design-rationale/format3.md
  - Internals:
      - Mechanisms: mechanisms.md
      - Components: components.md
  - Reference:
      - CLI: cli.md
      - CLI style contract: cli-style.md
      - Compatibility: compatibility.md
  - The annotated implementation: book/index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list          # {#custom-anchor} targets, linked from the glossary
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rz4/reticuli
      name: reticuli on GitHub
