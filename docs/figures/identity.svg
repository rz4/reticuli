<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>

  <!-- identity boundary -->
  <rect x="20" y="20" width="400" height="300" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-dasharray="7 5" stroke-width="1.5"/>
  <text x="40" y="48" font-size="15" font-weight="bold" fill="#37474f">PINNED — inside the identity</text>

  <rect x="40" y="65" width="360" height="62" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="56" y="90" font-size="14" font-weight="bold" fill="#263238" font-family="monospace">criteria/</text>
  <text x="56" y="110" font-size="13" fill="#455a64">executable acceptance checks — what must pass</text>

  <rect x="40" y="137" width="360" height="62" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="56" y="162" font-size="14" font-weight="bold" fill="#263238" font-family="monospace">spec/</text>
  <text x="56" y="182" font-size="13" fill="#455a64">meaning and conformance vectors — what it is for</text>

  <rect x="40" y="209" width="360" height="62" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="56" y="234" font-size="14" font-weight="bold" fill="#263238" font-family="monospace">reticuli.toml</text>
  <text x="56" y="254" font-size="13" fill="#455a64">declared inputs, build steps, gates — how to judge it</text>

  <!-- hash arrow -->
  <line x1="420" y1="170" x2="520" y2="170" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="158" font-size="12" fill="#455a64" text-anchor="middle">SHA-256</text>

  <!-- root -->
  <rect x="525" y="135" width="310" height="70" rx="8" fill="#1565c0" stroke="none"/>
  <text x="680" y="165" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">THE ROOT = the identity</text>
  <text x="680" y="188" font-size="13" fill="#e3f2fd" text-anchor="middle" font-family="monospace">64 hex characters naming the claim</text>

  <!-- outside -->
  <rect x="440" y="238" width="395" height="82" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="458" y="263" font-size="14" font-weight="bold" fill="#37474f"><tspan font-family="monospace">src/</tspan>  implementation — GENERATED, outside the root</text>
  <text x="458" y="285" font-size="13" fill="#455a64">any candidate that passes the gate is an equal member;</text>
  <text x="458" y="304" font-size="13" fill="#455a64">rewriting it — by anyone, or any agent — changes nothing above</text>

  <text x="40" y="360" font-size="13" fill="#607d8b">Also outside: tests/ (confidence, not identity), docs/, research/.</text>
  <text x="40" y="380" font-size="13" fill="#607d8b">Change a pinned byte and the root moves: it is a different claim. Change the implementation and it does not.</text>
</svg>
