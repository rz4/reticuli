<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="860" height="330" fill="#ffffff"/>

  <!-- inner loop -->
  <rect x="20" y="20" width="395" height="250" rx="10" fill="#eceff1" stroke="#90a4ae"/>
  <text x="217" y="48" font-size="15" font-weight="bold" fill="#263238" text-anchor="middle">THE INNER LOOP — hours</text>
  <text x="217" y="67" font-size="12.5" fill="#607d8b" text-anchor="middle">the identity never moves here</text>

  <rect x="45" y="85" width="160" height="38" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="125" y="109" font-size="13" fill="#263238" text-anchor="middle">author &amp; seal</text>
  <rect x="230" y="85" width="160" height="38" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="310" y="104" font-size="13" fill="#263238" text-anchor="middle">reconstruct blind</text>
  <text x="310" y="118" font-size="11" fill="#607d8b" text-anchor="middle">(a producer: often an agent)</text>
  <rect x="230" y="160" width="160" height="38" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="310" y="179" font-size="13" fill="#263238" text-anchor="middle">judge: gate, crosscheck,</text>
  <text x="310" y="193" font-size="13" fill="#263238" text-anchor="middle">cold audit</text>
  <rect x="45" y="160" width="160" height="38" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="125" y="184" font-size="13" fill="#263238" text-anchor="middle">record the evidence</text>

  <line x1="205" y1="104" x2="228" y2="104" stroke="#37474f" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="310" y1="123" x2="310" y2="158" stroke="#37474f" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="228" y1="179" x2="207" y2="179" stroke="#37474f" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="125" y1="158" x2="125" y2="125" stroke="#37474f" stroke-width="1.8" marker-end="url(#c)"/>

  <text x="217" y="240" font-size="12.5" fill="#455a64" text-anchor="middle">implementations are cheap, replaceable,</text>
  <text x="217" y="257" font-size="12.5" fill="#455a64" text-anchor="middle">and interchangeable within one fixed root</text>

  <!-- outer loop -->
  <rect x="445" y="20" width="395" height="250" rx="10" fill="#fff8e1" stroke="#f9a825"/>
  <text x="642" y="48" font-size="15" font-weight="bold" fill="#263238" text-anchor="middle">THE OUTER LOOP — days</text>
  <text x="642" y="67" font-size="12.5" fill="#8d6e63" text-anchor="middle">every pass through it moves the root</text>

  <rect x="470" y="85" width="160" height="38" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="550" y="104" font-size="13" fill="#263238" text-anchor="middle">populations of passing</text>
  <text x="550" y="118" font-size="13" fill="#263238" text-anchor="middle">implementations</text>
  <rect x="655" y="85" width="160" height="38" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="735" y="104" font-size="13" fill="#263238" text-anchor="middle">pressure: probe for</text>
  <text x="735" y="118" font-size="13" fill="#263238" text-anchor="middle">behavioral differences</text>
  <rect x="655" y="160" width="160" height="38" rx="6" fill="#ffffff" stroke="#546e7a"/>
  <text x="735" y="184" font-size="13" fill="#263238" text-anchor="middle">queue of findings</text>
  <rect x="470" y="160" width="160" height="38" rx="6" fill="#c62828"/>
  <text x="550" y="179" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">HUMAN SIGNATURE</text>
  <text x="550" y="193" font-size="11.5" fill="#ffcdd2" text-anchor="middle">the only way obligations change</text>

  <line x1="630" y1="104" x2="653" y2="104" stroke="#37474f" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="735" y1="123" x2="735" y2="158" stroke="#37474f" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="653" y1="179" x2="632" y2="179" stroke="#37474f" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="550" y1="158" x2="550" y2="125" stroke="#37474f" stroke-width="1.8" marker-end="url(#c)"/>

  <text x="642" y="240" font-size="12.5" fill="#455a64" text-anchor="middle">a signature amends the criteria → the root moves →</text>
  <text x="642" y="257" font-size="12.5" fill="#455a64" text-anchor="middle">the population retires and re-qualifies against the new identity</text>

  <text x="430" y="300" font-size="13" fill="#607d8b" text-anchor="middle">The loops run at different speeds on purpose: agents and machinery may be fast and wrong on the left;</text>
  <text x="430" y="318" font-size="13" fill="#607d8b" text-anchor="middle">the right moves only at the speed of human judgment.</text>
</svg>
