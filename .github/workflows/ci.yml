name: checks

on:
  push:
    branches: [main]
  pull_request:

# macOS runners are scarce and this workflow asks for three of them per run.
# Measured 2026-11-03: four pushes inside one hour put a dozen macOS jobs in
# contention, and jobs that started on a contended runner ran 15-21 minutes
# against a normal 6-7 and were then CANCELLED -- four consecutive red runs on
# main, every one of them a cancellation rather than a failing assertion, with
# the cancelled Python version varying at random. Serializing per ref makes a
# later push wait for the earlier one instead of competing with it.
#
# cancel-in-progress is deliberately PULL-REQUEST ONLY. A superseded PR run
# proves nothing and should die, but every push to main must be verified to
# completion: a commit here may move the claim's root, and a root with no
# green run has been checked nowhere but the author's machine.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Linux only, and this is what the README badge reports. The macOS leg
    # moved to its own workflow on 2026-11-04 after the third starvation
    # incident -- see macos.yml. It still runs; it no longer decides whether
    # this repository looks broken.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    uses: ./.github/workflows/suite.yml
    with:
      os: ubuntu-latest
      python: ${{ matrix.python }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: an unpinned linter turns an upstream release into a surprise
      # red build on a commit that changed nothing.
      - run: pipx install ruff==0.16.5
      - run: ruff check .

  docs:
    # The site is the outside reader's first contact, so build it the way a
    # reader would receive it: --strict, where a dead cross-reference or a
    # page missing from the nav is an error rather than a line of log nobody
    # reads. A broken ../SECURITY.md link sat in the published site until
    # 2026-11-04 precisely because nothing failed on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r docs/requirements.txt
      - name: build the documentation site, strictly
        run: mkdocs build --strict

  package:
    # Test the artifact users receive, not just the source checkout. A green
    # source tree can still ship a broken distribution: wrong metadata, a
    # module left out of the wheel, or a version that disagrees with itself.
    # So build the sdist and wheel, check their metadata, and install EACH into
    # a clean virtualenv to run the real `ret` entry point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: build sdist and wheel, and check their metadata
        run: |
          python3 -m pip install --quiet build twine
          python3 -m build
          python3 -m twine check dist/*

      - name: the wheel installs clean and its version agrees with the source
        run: |
          ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python3 -m venv "$RUNNER_TEMP/whl"
          "$RUNNER_TEMP/whl/bin/pip" install --quiet dist/*.whl
          "$RUNNER_TEMP/whl/bin/ret" --help > /dev/null
          "$RUNNER_TEMP/whl/bin/ret" --version | grep -q "$ver" || {
            echo "installed version disagrees with pyproject ($ver):"
            "$RUNNER_TEMP/whl/bin/ret" --version
            exit 1
          }
          "$RUNNER_TEMP/whl/bin/ret" verify examples/quirkcalc

      - name: the sdist installs clean and runs
        run: |
          python3 -m venv "$RUNNER_TEMP/sd"
          "$RUNNER_TEMP/sd/bin/pip" install --quiet dist/*.tar.gz
          "$RUNNER_TEMP/sd/bin/ret" --version
          "$RUNNER_TEMP/sd/bin/ret" verify examples/quirkcalc

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
