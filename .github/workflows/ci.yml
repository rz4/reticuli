name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Both platforms on purpose: macOS has a functional seatbelt sandbox and
    # Linux runners typically do not. The acceptance suites take different
    # branches accordingly — where no sandbox exists that fact is recorded,
    # never faked — so a kernel that conforms on only one platform fails here.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: identity is interpreter-independent
        run: |
          for claim in conformance/kernel conformance/kernel-2.0 \
                       examples/quirkcalc examples/tomli examples/make \
                       examples/weak; do
            echo "== $claim"
            python3 -m reticuli.reference verify "$claim"
          done

      # conformance/ is exactly the criteria: every file in it decides what
      # this repository claims to be. The glob has no exceptions now that the
      # reference sealer — an implementation, not a criterion — lives in src/.
      - name: the conformance suites
        run: |
          status=0
          for f in conformance/*.py; do
            echo "== $f"
            python3 "$f" || status=1
          done
          exit $status

      - name: tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      # Verifying identity is not verifying health: `verify` says the bytes
      # still hash to the sealed root, and says nothing about whether the
      # claim still HOLDS. Audit re-runs each example's gate and requires its
      # pinned bytes to reproduce, so no example can rot behind a valid name.
      # examples/make is deliberately absent here: its generated output is a
      # compiled binary that is not committed, so there is nothing present to
      # re-earn a verdict on. Its gate is exercised by the rebuild step below,
      # which produces the binary first — the same coverage by the honest route.
      - name: every example claim re-earns its verdict
        run: |
          status=0
          for claim in examples/quirkcalc examples/tomli examples/weak; do
            echo "== $claim"
            PYTHONPATH=src python3 -m reticuli audit "$claim" || status=1
          done
          exit $status

      # A producer need not be a model: here it is a compiler. Two compiler
      # settings must produce different binaries and the SAME root, which is
      # the claim's whole point stated on a compiled artifact.
      - name: a claim whose producer is make
        run: |
          PYTHONPATH=src python3 -m reticuli rebuild examples/make \
            --producer "make" --into "$RUNNER_TEMP/mk-a"
          PYTHONPATH=src python3 -m reticuli rebuild examples/make \
            --producer "make CFLAGS=-O0" --into "$RUNNER_TEMP/mk-b"
          a=$(python3 -m reticuli.reference root "$RUNNER_TEMP/mk-a")
          b=$(python3 -m reticuli.reference root "$RUNNER_TEMP/mk-b")
          echo "root -O2: $a"
          echo "root -O0: $b"
          test "$a" = "$b"
          cmp -s "$RUNNER_TEMP/mk-a/wordcount" "$RUNNER_TEMP/mk-b/wordcount" \
            && { echo "expected different binaries"; exit 1; } || true

      - name: the package installs and its entry point runs
        run: |
          python3 -m pip install --quiet .
          ret --help > /dev/null
          ret verify examples/quirkcalc
          # Also from a git URL, because that is what the README tells people to
          # run. It builds from a clean clone rather than the working tree, so it
          # catches anything that only works because a file is present locally
          # but uncommitted. The import check runs from a neutral directory: the
          # repository's own src/ shadows an installed package otherwise, which
          # is exactly how a healthy install can be made to look broken.
          python3 -m pip install --quiet "git+file://$(pwd)"
          cd "$RUNNER_TEMP"
          python3 -c "import reticuli.kernel, reticuli.assess, reticuli.producers.openai"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: an unpinned linter turns an upstream release into a surprise
      # red build on a commit that changed nothing.
      - run: pipx install ruff==0.16.5
      - run: ruff check .
