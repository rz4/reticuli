name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Both platforms on purpose: macOS has a functional seatbelt sandbox and
    # Linux runners typically do not. The acceptance suites take different
    # branches accordingly — where no sandbox exists that fact is recorded,
    # never faked — so a kernel that conforms on only one platform fails here.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: identity is interpreter-independent
        run: |
          for claim in conformance/kernel conformance/kernel-2.0 \
                       examples/quirkcalc examples/tomli; do
            echo "== $claim"
            python3 conformance/reference_seal.py verify "$claim"
          done

      - name: the conformance suites
        run: |
          status=0
          for f in conformance/*_check.py; do
            echo "== $f"
            python3 "$f" || status=1
          done
          exit $status

      - name: tests
        run: |
          status=0
          for f in tests/*.py; do
            echo "== $f"
            python3 "$f" || status=1
          done
          exit $status

      # Verifying identity is not verifying health: `verify` says the bytes
      # still hash to the sealed root, and says nothing about whether the
      # claim still HOLDS. Audit re-runs each example's gate and requires its
      # pinned bytes to reproduce, so no example can rot behind a valid name.
      - name: every example claim re-earns its verdict
        run: |
          status=0
          for claim in examples/quirkcalc examples/tomli; do
            echo "== $claim"
            PYTHONPATH=src python3 -m reticuli audit "$claim" || status=1
          done
          exit $status

      - name: the package installs and its entry point runs
        run: |
          python3 -m pip install --quiet .
          ret --help > /dev/null
          ret verify examples/quirkcalc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: an unpinned linter turns an upstream release into a surprise
      # red build on a commit that changed nothing.
      - run: pipx install ruff==0.16.5
      - run: ruff check .
