# The vendor producers (src/reticuli/producers/) are DELIBERATELY not
# declared here. A producer is any program `rebuild` invokes -- substrate,
# not identity -- and the shipped adapters for specific vendors' models
# churn as those models and SDKs change. What this claim promises is the
# fixpoint free of any particular producer: the harness (rebuild,
# crosscheck, verify, audit, seal) reproduces a claim's root given ANY
# conforming producer. The adapters ship in the tree as bundled tooling,
# outside the equivalence class, so they can change without renaming
# reticuli -- exactly as a rewritten implementation does not. This also
# matches the self-hosting chain, which never carried them.

[[step]]
kind = "gate"
output = "REPO_OK"
class = "validated"
run = "python3 gate.py"
