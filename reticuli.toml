# THE REPOSITORY AS A CLAIM ABOUT ITSELF.
#
# Read the class column before anything else. `src/reticuli/` is GENERATED, so
# the package's bytes are OUTSIDE this root: rewrite any of it and the root
# does not move. Everything that DECIDES -- this recipe, the specification, the
# acceptance suites, and the sealed kernel claim they judge against -- is
# PINNED, so it is INSIDE. The root therefore names an equivalence class: every
# implementation that satisfies these criteria.
#
#     PYTHONPATH=src python3 -m reticuli verify .    # do the bytes match the root?
#     PYTHONPATH=src python3 -m reticuli audit .     # re-run every criterion, cold
#
# `verify` is a hash comparison and takes milliseconds. `audit` re-earns the
# verdict: it materialises the declared files into a sandboxed workspace and
# runs gate.py there, which runs every suite in criteria/.
#
# EDITING A PINNED FILE MOVES THE ROOT, and it should -- a changed criterion is
# a different, usually stronger claim. When that happens the recorded root must
# be re-earned, or `verify` will report the mismatch:
#
#     python3 -c "from reticuli import kernel; kernel.seal('.')"
#
# ONLY THE KERNEL CLAIM'S SUITE is pinned from examples/kernel/, never its
# implementation. Anything pinned is materialised into a rebuilding producer's
# room, so pinning that kernel would hand an M3 a conformant one while asking
# it to write another. A suite is a criterion and belongs in the room; an
# implementation is the answer and does not.
#
# NOT pinned, deliberately: tests/ (they change confidence, not identity),
# docs/, README, CHANGELOG. Prose is not a criterion.

[claim]
name = "reticuli"
inputs = [
    "spec/claim-format.md",
    "spec/identity.md",
    "spec/kernel-api.md",
    "spec/layers.md",
    "spec/record.md",
    "spec/verification.md",
    "criteria/agents_check.py",
    "criteria/authoring_check.py",
    "criteria/exchange_check.py",
    "criteria/kernel_check.py",
    "criteria/kernel_parity.py",
    "criteria/launcher_check.py",
    "criteria/self_check.py",
    "criteria/surface_check.py",
    "gate.py",
    "scripts/selfclaim.py",
]

[[step]]
kind = "produce"
output = "src/reticuli/__init__.py"
class = "generated"
request = "regenerate src/reticuli/__init__.py to pass the gate"

