[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reticuli"
version = "2.0.0.dev0"
description = "A verification framework for computational claims"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "R. Zamora Resendiz" }]
keywords = ["reproducibility", "verification", "content-addressed", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

# The package itself has none and should keep none — standard library only,
# deliberately. `dev` is for the ordinary test suite. The CONFORMANCE suites
# take nothing from this list: the criteria have to be checkable on a bare
# interpreter, or "verify it yourself" comes with an install step attached.
[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/rz4/reticuli"

[project.scripts]
ret = "reticuli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "criteria", "tests", "scripts"]
# NEVER lint or format a sealed claim. The bytes of a claim's acceptance suite
# and fixtures are pinned INPUTS — they sit inside its root hash. A formatter run
# over them would silently move the root and break the claim; the generated
# bytes under a sealed claim are frozen evidence besides, kept exactly as a
# model regrew them. (CI's `reticuli.reference` verify step is the backstop if
# this exclusion is ever lost.)
# This list must MOVE WITH THE CLAIMS. A sealed claim is only as safe as the
# exclusion naming where it currently lives — when the claims were relocated,
# ruff immediately proposed reformatting them again. The suites in
# criteria/*.py ARE linted: they are source we maintain, and if a formatter
# ever changes their bytes, criteria/self_check.py fails loudly rather than
# silently renaming a layer.
# examples/ covers every sealed claim now that the two kernel claims live
# there. When this list last went stale after a move, ruff immediately
# proposed reformatting the sealed suites again — which is the failure this
# comment exists to prevent. spec/vectors/ joined for the same reason: the
# conformance vectors' bytes are pinned into the repository's own root, and
# two of their fixture files end in .py without being programs.
extend-exclude = ["examples", "spec/vectors"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# A check must put the package under test on sys.path before importing it,
# so the import cannot sit in a sorted block at the top of the file.
"criteria/*.py" = ["E402", "I001"]
"tests/*.py" = ["E402", "I001"]
"scripts/*.py" = ["E402", "I001"]
