[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reticuli"
version = "2.0.0.dev0"
description = "A verification framework for computational claims"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "R. Zamora Resendiz" }]
keywords = ["reproducibility", "verification", "content-addressed", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
ret = "reticuli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "checks", "tools"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# A check must put the package under test on sys.path before importing it,
# so the import cannot sit in a sorted block at the top of the file.
"checks/*.py" = ["E402", "I001"]
